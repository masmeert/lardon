name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      APP_ENV: production
      NO_COLOR: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        shell: bash
        working-directory: packages/infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          node-version: "26"
          cache: true
      - run: vp exec alchemy provider check-env --no-input
      - name: Plan
        run: |
          vp exec alchemy plan --stage prod --no-input 2>&1 | tee plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '[0-9]+ to (delete|replace)' plan.txt; then
            echo "::error::This plan deletes or replaces resources. Deploy it by hand after checking the plan."
            exit 1
          fi
      - run: vp exec alchemy deploy --stage prod --yes --no-input
